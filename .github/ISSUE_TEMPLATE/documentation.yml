name: Documentation Issue
description: Report missing, incorrect, or unclear OctoCare documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the OctoCare documentation.
  - type: dropdown
    id: issue-type
    attributes:
      label: Documentation Issue
      description: What kind of change is needed?
      options:
        - Missing documentation
        - Incorrect or outdated information
        - Unclear instructions
        - Broken link or example
        - Typo or formatting
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Getting Started
        - Customer Portal
        - Agent Dashboard
        - API
        - AI Triage Worker
        - SLA Worker
        - Database
        - Infrastructure
        - CI/CD
        - Contributor Guidance
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Link to or identify the affected file, page, heading, or example.
      placeholder: README.md#deployment
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, incorrect, or difficult to understand?
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Suggested Change
      description: Describe the content or correction you would like to see.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include relevant screenshots, links, or related issues.
