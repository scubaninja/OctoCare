name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  summary:
    name: Dependency Review Summary
    if: always()
    needs: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Generate dependency review summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          started_at=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" |
            jq --raw-output '.run_started_at')
          duration_seconds=$(($(date +%s) - $(date --date="$started_at" +%s)))
          printf -v duration '%dm %02ds' \
            $((duration_seconds / 60)) $((duration_seconds % 60))

          case "$REVIEW_RESULT" in
            success) status="Success" ;;
            failure) status="Failure" ;;
            cancelled) status="Cancelled" ;;
            *) status="$REVIEW_RESULT" ;;
          esac

          {
            echo "## Dependency Review Summary"
            echo
            echo "**Status:** $status"
            echo
            echo "**Output:** Dependency changes checked for vulnerabilities of moderate severity or higher."
            echo
            echo "**Duration:** $duration"
            echo
            echo "### Review"
            echo
            echo "| Policy | Result |"
            echo "| --- | --- |"
            echo "| Fail on moderate or higher severity | $REVIEW_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
