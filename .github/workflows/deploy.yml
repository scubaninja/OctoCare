name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  packages: write

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_database_admin_password: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TERRAFORM_WORKING_DIRECTORY: infra/terraform
  PROJECT_NAME: octocare
  ENVIRONMENT_NAME: production
  RESOURCE_GROUP: octocare-production-rg
  ACR_NAME: octocareproductionacr
  ACR_LOGIN_SERVER: octocareproductionacr.azurecr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} fmt -check

      - name: Terraform init
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} init -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} validate

      - name: Terraform plan
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_WORKING_DIRECTORY }}/tfplan

  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_WORKING_DIRECTORY }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} init -input=false

      - name: Terraform apply
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} apply -input=false tfplan

  deploy-images:
    name: Deploy Images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: push-api
        env:
          IMAGE_NAME: octocare-api
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Attest API image to GHCR
        env:
          IMAGE_NAME: octocare-api
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-api.outputs.digest }}
          push-to-registry: true

      - name: Attest API image to ACR
        env:
          IMAGE_NAME: octocare-api
          REGISTRY: ${{ env.ACR_LOGIN_SERVER }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-api.outputs.digest }}
          push-to-registry: true

      - name: Build and push web image
        id: push-web
        env:
          IMAGE_NAME: octocare-web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Attest web image to GHCR
        env:
          IMAGE_NAME: octocare-web
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true

      - name: Attest web image to ACR
        env:
          IMAGE_NAME: octocare-web
          REGISTRY: ${{ env.ACR_LOGIN_SERVER }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true

      - name: Build and push AI triage worker image
        id: push-ai
        env:
          IMAGE_NAME: ai-triage-worker
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-triage-worker
          file: ./services/ai-triage-worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Attest AI triage worker image to GHCR
        env:
          IMAGE_NAME: ai-triage-worker
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-ai.outputs.digest }}
          push-to-registry: true

      - name: Attest AI triage worker image to ACR
        env:
          IMAGE_NAME: ai-triage-worker
          REGISTRY: ${{ env.ACR_LOGIN_SERVER }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-ai.outputs.digest }}
          push-to-registry: true

      - name: Build and push SLA worker image
        id: push-sla
        env:
          IMAGE_NAME: sla-worker
        uses: docker/build-push-action@v5
        with:
          context: ./services/sla-worker
          file: ./services/sla-worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Attest SLA worker image to GHCR
        env:
          IMAGE_NAME: sla-worker
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-sla.outputs.digest }}
          push-to-registry: true

      - name: Attest SLA worker image to ACR
        env:
          IMAGE_NAME: sla-worker
          REGISTRY: ${{ env.ACR_LOGIN_SERVER }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-sla.outputs.digest }}
          push-to-registry: true

  deploy-apps:
    name: Deploy Apps
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: deploy-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update App Service containers
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-production-api \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/octocare-api:${{ env.IMAGE_TAG }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }}

          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-production-web \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/octocare-web:${{ env.IMAGE_TAG }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }}

      - name: Update Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-production-ai-triage \
            --image ${{ env.ACR_LOGIN_SERVER }}/ai-triage-worker:${{ env.IMAGE_TAG }}

          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-production-sla \
            --image ${{ env.ACR_LOGIN_SERVER }}/sla-worker:${{ env.IMAGE_TAG }}

  summary:
    name: Deployment Summary
    if: always()
    needs: [terraform-plan, terraform-apply, deploy-images, deploy-apps]
    runs-on: ubuntu-latest
    env:
      PLAN_STATUS: ${{ needs.terraform-plan.result }}
      APPLY_STATUS: ${{ needs.terraform-apply.result }}
      IMAGES_STATUS: ${{ needs.deploy-images.result }}
      APPS_STATUS: ${{ needs.deploy-apps.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Generate deployment summary
        run: |
          started_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')
          elapsed=$(( $(date +%s) - $(date -d "$started_at" +%s) ))
          printf -v duration '%02dh %02dm %02ds' $((elapsed / 3600)) $(((elapsed % 3600) / 60)) $((elapsed % 60))

          status="success"
          icon="✅"
          for result in "$PLAN_STATUS" "$APPLY_STATUS" "$IMAGES_STATUS" "$APPS_STATUS"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              status="$result"
              icon="❌"
              break
            fi
            if [[ "$result" == "skipped" ]]; then
              status="skipped"
              icon="⏭️"
            fi
          done

          {
            echo "## 🚀 Deployment Summary"
            echo
            echo "$icon **Status:** $status"
            echo "📦 **Output:** Production infrastructure, container images, App Services, and Container Apps"
            echo "🏷️ **Image tag:** \`${IMAGE_TAG}\`"
            echo "⏱️ **Duration:** $duration"
            echo
            echo "### Deployment results"
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Terraform plan | $PLAN_STATUS |"
            echo "| Terraform apply | $APPLY_STATUS |"
            echo "| Build and push images | $IMAGES_STATUS |"
            echo "| Deploy applications | $APPS_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
