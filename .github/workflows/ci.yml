name: CI/CD Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false

  build-workers:
    name: Build Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build AI triage worker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-triage-worker
          file: ./services/ai-triage-worker/Dockerfile
          push: false

      - name: Build SLA worker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/sla-worker
          file: ./services/sla-worker/Dockerfile
          push: false

  deploy-dev:
    name: Deploy - Dev
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-api, build-web, build-workers]
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deployment to development
        run: echo "Pretending to deploy OctoCare to development."

  deploy-prod:
    name: Deploy - Prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: Deploy - Prod
    steps:
      - name: Simulate deployment to production
        run: echo "Pretending to deploy OctoCare to production."
