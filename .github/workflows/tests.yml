name: Pull Request Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-validation:
    name: Web Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm test --if-present

      - name: Lint web app
        run: npm run lint

      - name: Build web app
        run: npm run build

  dotnet-validation:
    name: .NET Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build API
        run: dotnet build apps/api/OctoCare.Api.csproj --configuration Release

      - name: Build AI triage worker
        run: dotnet build services/ai-triage-worker/AiTriageWorker.csproj --configuration Release

      - name: Build SLA worker
        run: dotnet build services/sla-worker/SlaWorker.csproj --configuration Release

      - name: Run .NET tests
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) | sort)

          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "No .NET test projects found."
            exit 0
          fi

          for project in "${test_projects[@]}"; do
            dotnet test "$project" --configuration Release
          done
