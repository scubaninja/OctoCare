name: Deploy Test

on:
  push:
    branches: [test, staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_database_admin_password: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TERRAFORM_WORKING_DIRECTORY: infra/terraform
  PROJECT_NAME: octocare
  ENVIRONMENT_NAME: test
  RESOURCE_GROUP: octocare-test-rg
  ACR_NAME: octocatetestacr
  ACR_LOGIN_SERVER: octocatetestacr.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} fmt -check

      - name: Terraform init
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} init -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} validate

      - name: Terraform plan
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-test
          path: ${{ env.TERRAFORM_WORKING_DIRECTORY }}/tfplan

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-test
          path: ${{ env.TERRAFORM_WORKING_DIRECTORY }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} init -input=false

      - name: Terraform apply
        run: terraform -chdir=${{ env.TERRAFORM_WORKING_DIRECTORY }} apply -input=false tfplan

  deploy-images:
    name: Deploy Images
    needs: terraform-apply
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/octocare-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/octocare-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/octocare-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/octocare-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/octocare-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/octocare-web:latest

      - name: Build and push AI triage worker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-triage-worker
          file: ./services/ai-triage-worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/ai-triage-worker:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/ai-triage-worker:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/ai-triage-worker:latest

      - name: Build and push SLA worker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/sla-worker
          file: ./services/sla-worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/sla-worker:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/sla-worker:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/sla-worker:latest

  deploy-apps:
    name: Deploy Apps
    needs: deploy-images
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update App Service containers
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-test-api \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/octocare-api:${{ env.IMAGE_TAG }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }}

          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-test-web \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/octocare-web:${{ env.IMAGE_TAG }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }}

      - name: Update Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-test-ai-triage \
            --image ${{ env.ACR_LOGIN_SERVER }}/ai-triage-worker:${{ env.IMAGE_TAG }}

          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name octocare-test-sla \
            --image ${{ env.ACR_LOGIN_SERVER }}/sla-worker:${{ env.IMAGE_TAG }}
