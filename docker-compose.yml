version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8080
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=octocare;Username=octocare;Password=octocare_dev
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_OPENAI_API_KEY}
    depends_on:
      - db

  ai-triage-worker:
    build:
      context: ./services/ai-triage-worker
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=octocare;Username=octocare;Password=octocare_dev
      - AzureOpenAI__Endpoint=${AZURE_OPENAI_ENDPOINT}
      - AzureOpenAI__ApiKey=${AZURE_OPENAI_API_KEY}
    depends_on:
      - db

  sla-worker:
    build:
      context: ./services/sla-worker
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=octocare;Username=octocare;Password=octocare_dev
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=octocare
      - POSTGRES_USER=octocare
      - POSTGRES_PASSWORD=octocare_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
